<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="水印分析是 GCSA 推出的 iOS 与 Android 本地媒体检查应用，用于检查内容凭证、水印信号与可疑特征，并提供智能打码能力。"
    />
    <meta name="theme-color" content="#000205" />
    <meta property="og:title" content="水印分析 — 本地水印检测与智能打码" />
    <meta property="og:description" content="在 iPhone 与 Android 设备本地检查图片、视频和音频中的内容凭证与水印信号。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GCSA WATERMARK" />
    <meta property="og:url" content="https://watermarkinspector.gcsa.org/" />
    <meta property="og:image" content="https://watermarkinspector.gcsa.org/og.png" />
    <meta property="og:image:alt" content="GCSA WATERMARK mobile media inspection preview" />
    <meta property="og:image:width" content="1730" />
    <meta property="og:image:height" content="909" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="水印分析 — GCSA" />
    <meta name="twitter:description" content="面向 iOS 与 Android 的隐私优先本地媒体检查应用。" />
    <meta name="twitter:image" content="https://watermarkinspector.gcsa.org/og.png" />
    <meta name="twitter:image:alt" content="GCSA WATERMARK mobile media inspection preview" />
    <link rel="canonical" href="https://watermarkinspector.gcsa.org/" />
    <script>
      (() => {
        let theme = 'dark'
        let locale = ''
        try {
          const savedTheme = localStorage.getItem('gcsa-site-theme')
          const savedLocale = localStorage.getItem('gcsa-site-locale')
          if (savedTheme === 'light' || savedTheme === 'dark') theme = savedTheme
          if (savedLocale === 'zh-CN' || savedLocale === 'zh-Hant' || savedLocale === 'en') locale = savedLocale
        } catch {}
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme
        if (locale) document.documentElement.lang = locale === 'zh-Hant' ? 'zh-Hant' : locale
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#000205' : '#f7f9fb')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Orbitron:wght@500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/gcsa-icon.svg" />
    <title>水印分析 — GCSA</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
