# HOME GUARD - homeguard.erjinyi.com / homeguard.gcsa.org
# The erjinyi.com host terminates TLS locally. The gcsa.org host terminates TLS
# on an upstream Nginx proxy and reaches this server over HTTP with Host kept.

server {
    listen 80;
    listen [::]:80;
    server_name homeguard.erjinyi.com;

    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name homeguard.gcsa.org;

    root /var/www/homeguard;
    index index.html;

    access_log /var/log/nginx/homeguard-access.log combined;
    error_log  /var/log/nginx/homeguard-error.log warn;

    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location ^~ /server/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name homeguard.erjinyi.com;

    ssl_certificate     /etc/nginx/ssl/star.erjinyi.com.crt;
    ssl_certificate_key /etc/nginx/ssl/star.erjinyi.com.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/homeguard;
    index index.html;

    access_log /var/log/nginx/homeguard-access.log combined;
    error_log  /var/log/nginx/homeguard-error.log warn;

    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location ^~ /server/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}
