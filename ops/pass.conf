# pass - pass.erjinyi.com / passrecover.gcsa.org
# Certificate: *.erjinyi.com wildcard certificate covers pass.erjinyi.com.
# passrecover.gcsa.org terminates TLS at the upstream Nginx and is proxied here
# over HTTP.

# HTML must never leave an old asset manifest in browsers or intermediary CDNs.
# Vite's content-hashed /assets/ files are safe to cache permanently; stable-name
# public files are stored only with mandatory revalidation.
map "$uri|$sent_http_content_type" $passrecover_cache_control {
    default "";
    ~^/(?:.*?/)?assets/ "public, max-age=31536000, immutable";
    ~[|]text/html "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, s-maxage=0";
    ~^/.*\.(?:css|js|mjs|html?|json|map|png|jpg|jpeg|gif|webp|avif|svg|ico|woff|woff2|ttf|otf|xml|txt)[|] "no-cache, must-revalidate";
}

map $sent_http_content_type $passrecover_cdn_cache_control {
    default "";
    ~text/html "no-store";
}

map $sent_http_content_type $passrecover_x_accel_expires {
    default "";
    ~text/html "0";
}

# ---------------------------------------------------------------------------
# HTTP -> HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name pass.erjinyi.com;

    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# HTTP origin for the upstream Nginx
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name passrecover.gcsa.org;

    root /var/www/pass;
    index index.html index.htm;

    access_log /var/log/nginx/pass-access.log combined;
    error_log  /var/log/nginx/pass-error.log warn;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json application/rss+xml application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $passrecover_cache_control always;
    add_header CDN-Cache-Control $passrecover_cdn_cache_control always;
    add_header Cloudflare-CDN-Cache-Control $passrecover_cdn_cache_control always;
    add_header X-Accel-Expires $passrecover_x_accel_expires always;

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?|ttf|otf)$ {
        try_files $uri =404;
    }

    location ~* \.(?:html?|json|map|txt|xml)$ {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pass.erjinyi.com;

    ssl_certificate     /etc/nginx/ssl/star.erjinyi.com.crt;
    ssl_certificate_key /etc/nginx/ssl/star.erjinyi.com.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/pass;
    index index.html index.htm;

    access_log /var/log/nginx/pass-access.log combined;
    error_log  /var/log/nginx/pass-error.log warn;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json application/rss+xml application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $passrecover_cache_control always;
    add_header CDN-Cache-Control $passrecover_cdn_cache_control always;
    add_header Cloudflare-CDN-Cache-Control $passrecover_cdn_cache_control always;
    add_header X-Accel-Expires $passrecover_x_accel_expires always;

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?|ttf|otf)$ {
        try_files $uri =404;
    }

    location ~* \.(?:html?|json|map|txt|xml)$ {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
