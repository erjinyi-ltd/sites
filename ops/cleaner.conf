# CLEANER - cleaner.erjinyi.com / cleaner.gcsa.org
# The erjinyi.com host terminates TLS locally. The gcsa.org host terminates TLS
# on an upstream Nginx proxy and reaches this server over HTTP with Host kept.

# HTML must never leave an old asset manifest in browsers or intermediary CDNs.
# Vite's content-hashed /assets/ files are safe to cache permanently; stable-name
# public files are stored only with mandatory revalidation.
map "$uri|$sent_http_content_type" $cleaner_cache_control {
    default "";
    ~^/(?:.*?/)?assets/ "public, max-age=31536000, immutable";
    ~[|]text/html "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, s-maxage=0";
    ~^/.*\.(?:css|js|mjs|json|map|png|jpg|jpeg|gif|webp|avif|svg|ico|woff|woff2|ttf|otf|xml|txt)[|] "no-cache, must-revalidate";
}

map $sent_http_content_type $cleaner_cdn_cache_control {
    default "";
    ~text/html "no-store";
}

map $sent_http_content_type $cleaner_x_accel_expires {
    default "";
    ~text/html "0";
}

server {
    listen 80;
    listen [::]:80;
    server_name cleaner.erjinyi.com;

    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name cleaner.gcsa.org;

    root /var/www/cleaner;
    index index.html;

    access_log /var/log/nginx/cleaner-access.log combined;
    error_log  /var/log/nginx/cleaner-error.log warn;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json application/rss+xml application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cleaner_cache_control always;
    add_header CDN-Cache-Control $cleaner_cdn_cache_control always;
    add_header Cloudflare-CDN-Cache-Control $cleaner_cdn_cache_control always;
    add_header X-Accel-Expires $cleaner_x_accel_expires always;

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|json|map|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?|ttf|otf|xml|txt)$ {
        try_files $uri =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location ^~ /server/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cleaner.erjinyi.com;

    ssl_certificate     /etc/nginx/ssl/star.erjinyi.com.crt;
    ssl_certificate_key /etc/nginx/ssl/star.erjinyi.com.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/cleaner;
    index index.html;

    access_log /var/log/nginx/cleaner-access.log combined;
    error_log  /var/log/nginx/cleaner-error.log warn;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json application/rss+xml application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cleaner_cache_control always;
    add_header CDN-Cache-Control $cleaner_cdn_cache_control always;
    add_header Cloudflare-CDN-Cache-Control $cleaner_cdn_cache_control always;
    add_header X-Accel-Expires $cleaner_x_accel_expires always;

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|json|map|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?|ttf|otf|xml|txt)$ {
        try_files $uri =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location ^~ /server/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}
