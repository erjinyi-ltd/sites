# HostSec - hostsec.erjinyi.com
# The introduction site is served from /var/www/hostsec. Control-plane routes
# continue to use the HostSec service listening on 127.0.0.1:9501.

# HTML must never leave an old asset manifest in browsers or intermediary CDNs.
# Vite's content-hashed /assets/ files are safe to cache permanently; stable-name
# public files are stored only with mandatory revalidation.
map "$uri|$sent_http_content_type" $hostsec_erjinyi_cache_control {
    default "";
    ~^/(?:.*?/)?assets/ "public, max-age=31536000, immutable";
    ~[|]text/html "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, s-maxage=0";
    ~^/.*\.(?:css|js|mjs|json|map|png|jpg|jpeg|gif|webp|avif|svg|ico|woff|woff2|ttf|otf|xml|txt)[|] "no-cache, must-revalidate";
}

map $sent_http_content_type $hostsec_erjinyi_cdn_cache_control {
    default "";
    ~text/html "no-store";
}

map $sent_http_content_type $hostsec_erjinyi_x_accel_expires {
    default "";
    ~text/html "0";
}

server {
    listen 80;
    listen [::]:80;
    server_name hostsec.erjinyi.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hostsec.erjinyi.com;

    ssl_certificate     /etc/nginx/cert/star.erjinyi.com.crt;
    ssl_certificate_key /etc/nginx/cert/star.erjinyi.com.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/hostsec;
    index index.html;
    charset utf-8;
    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json application/rss+xml application/xml image/svg+xml;

    access_log /var/log/nginx/hostsec-access.log combined;
    error_log  /var/log/nginx/hostsec-error.log warn;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $hostsec_erjinyi_cache_control always;
    add_header CDN-Cache-Control $hostsec_erjinyi_cdn_cache_control always;
    add_header Cloudflare-CDN-Cache-Control $hostsec_erjinyi_cdn_cache_control always;
    add_header X-Accel-Expires $hostsec_erjinyi_x_accel_expires always;

    location = /admin {
        return 308 /admin/;
    }

    location = /tenant {
        return 308 /tenant/;
    }

    # HostSec control-plane shared images use absolute /img/... URLs.
    location ^~ /img/ {
        proxy_pass http://127.0.0.1:9501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:9501;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ^~ /tenant/ {
        proxy_pass http://127.0.0.1:9501;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ^~ /agent/ {
        proxy_pass http://127.0.0.1:9501;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ^~ /tenant-preview/ {
        proxy_pass http://127.0.0.1:9501;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ^~ /downloads/ {
        proxy_pass http://127.0.0.1:9501;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ^~ /installers/ {
        proxy_pass http://127.0.0.1:9501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location = /health {
        proxy_pass http://127.0.0.1:9501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location = /metrics {
        proxy_pass http://127.0.0.1:9501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|json|map|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?|ttf|otf|xml|txt)$ {
        try_files $uri =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location ^~ /server/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}
